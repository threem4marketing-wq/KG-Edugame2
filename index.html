<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<title>🚀 مغامرة إنقاذ الكوكب الأزرق — المجلة الإلكترونية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- الخلفية الفضائية -->
<div class="bg-cloud c1">☁️</div>
<div class="bg-cloud c2">☁️</div>

<div class="shell">
  <!-- HUD العلوي -->
  <div class="hud">
    <h1>🚀 مغامرة إنقاذ الكوكب الأزرق</h1>
    <div class="track" id="track"></div>
    <div class="count"><span id="starCount">0</span>/16 ⭐</div>
  </div>

  <!-- كتاب المجلة -->
  <div class="book-wrap"><div class="book" id="book"></div></div>

  <!-- شريط التنقل -->
  <div class="nav">
    <button class="btn ghost" id="prev">▶ السابق</button>
    <div class="pgno" id="pgno">1 / 1</div>
    <button class="btn" id="next">التالي ◀</button>
  </div>
  <div class="hint">استخدم الأسهم ← → أو زر التالي للتنقل</div>
</div>

<script src="app.js"></script>
</body>
</html>
